<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png">
  
  <title>Frontend Mentor | Social links profile</title>

  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main>
    <div class="social-links-profile">
      <img src="assets/images/avatar-jessica.jpeg" alt="This is a profile image" class="profile-image">
      <h1 class="full-name">Jessica Randall</h1>
      <p class="location">London, United Kingdom</p>
      <p class="short-description">"Front-end developer and avid reader."</p>

      <button class="social-link">GitHub</button>
      <button class="social-link">Frontend Mentor</button>
      <button class="social-link">LinkedIn</button>
      <button class="social-link">Twitter</button>
      <button class="social-link">Instagram</button>
    </div>
  </main>
  
  <footer class="attribution">
    Challenge by <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>. 
    Coded by <a href="#">Your Name Here</a>.
  </footer>
</body>
</html>
